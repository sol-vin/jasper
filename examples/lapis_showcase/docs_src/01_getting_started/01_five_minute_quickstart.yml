id: FIVE_MINUTE_QUICKSTART
title: Getting Started with Lapis in 5 Minutes
summary: Complete hands-on tutorial to building your first Godot 4.8 game entity with Crystal.
track: 01_getting_started
overview: |
  Lapis bridges the elegance and speed of Crystal with the powerful scene graph of Godot 4.8.
  In this 5-minute showcase guide, authored by Developer Advocate Nu (Ν), you'll learn how to set up
  a project, declare a type-safe character node, expose inspector properties, wire input actions,
  and achieve zero-allocation physics processing.

related_sources:
  - "shard.yml"
  - "src/player.cr"

sections:
  - id: topic_01_prerequisites
    title: 1. Prerequisites & Environment Setup
    summary: Verify Godot 4.8-dev7 engine binary and Crystal toolchain.
    content: |
      Before beginning, ensure you have the following installed:
      - **Crystal**: `>= 1.10.0` (Verify with `crystal --version`)
      - **Godot Engine**: `4.8-dev7` or compatible GDExtension runtime
      - **Shards**: Standard Crystal package manager

      Add `lapis` to your `shard.yml`:
      ```yaml
      dependencies:
        lapis:
          github: sol-vin/lapis
          branch: 4.8-dev7
      ```
      Run `shards install` to link the GDExtension C headers and Crystal runtime bindings.

  - id: topic_02_project_scaffolding
    title: 2. Initializing Your Game Project
    summary: Scaffold a turnkey Godot and Crystal hybrid project structure.
    content: |
      Lapis organizes your game into a clean decoupled layout:
      ```
      my_game/
      ├── project.godot       # Godot 4.8 project manifest
      ├── shard.yml           # Crystal shard dependencies
      ├── bin/
      │   └── libgame.dll     # Compiled GDExtension shared library
      └── src/
          ├── game.cr         # Master entrypoint & registration
          └── player.cr       # Player character entity
      ```

  - id: topic_03_first_node
    title: 3. Declaring Your First Character Node
    summary: Author a strongly-typed CharacterBody3D using Lapis declarative macros.
    content: |
      In `src/player.cr`, declare your player character:
      ```crystal
      require "lapis"

      node Player < CharacterBody3D do
        prop speed : Float32 = 10.0
        prop jump_power : Float32 = 4.5
        prop gravity : Float32 = 9.8
        
        signal health_changed(new_health : Int32)
        signal fallen_off_world

        on_ready do
          puts "Player initialized at position #{global_position}"
        end
      end
      ```

  - id: topic_04_physics_movement
    title: 4. Handling Movement & Physics
    summary: Implement fluid 3D character physics with zero heap allocations on the hot path.
    content: |
      Hook into `on_physics_process` to read input and compute velocity:
      ```crystal
      on_physics_process do |delta|
        dir = Input.get_vector(
          "move_left", "move_right",
          "move_forward", "move_back"
        )

        vel = velocity
        vel.x = dir.x * speed
        vel.z = dir.y * speed

        unless is_on_floor
          vel.y -= gravity * Float32.new(delta)
        end

        if is_on_floor && Input.is_action_just_pressed("jump")
          vel.y = jump_power
        end

        self.velocity = vel
        move_and_slide

        if global_position.y < -50.0
          emit_signal(:fallen_off_world)
        end
      end
      ```

  - id: topic_05_editor_integration
    title: 5. Inspector Exports & Hot Reloading
    summary: Build the GDExtension library and inspect exported properties in Godot.
    content: |
      Compile your extension in release or debug mode:
      ```bash
      crystal build src/game.cr --link-flags="-shared" -o bin/libgame.dll
      ```
      Launch Godot 4.8:
      - The `Player` node appears in the **Create Node** dialog.
      - Properties (`speed`, `jump_power`, `gravity`) are editable in the **Inspector**.
      - Signals (`health_changed`, `fallen_off_world`) can be connected via the **Node** panel.
