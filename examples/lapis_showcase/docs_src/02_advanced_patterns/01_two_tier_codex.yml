id: TWO_TIER_CODEX
title: The Two-Tier Architecture Pattern
summary: Why and how to separate game logic engines from declarative Godot macros.
track: 02_advanced_patterns
overview: |
  The Sol-Vin Two-Tier Codex mandates separating core algorithmic game systems from user-facing
  macro syntax. This ensures maximum runtime throughput and testability outside the Godot engine.

related_sources:
  - "src/engine/combat_system.cr"
  - "src/dsl/combat_builder.cr"

sections:
  - id: topic_01_core_separation
    title: 1. Core Engine vs Declarative DSL
    summary: Structuring your gameplay code into two distinct tiers.
    content: |
      - **Tier 1 (Core Engine)**: High-speed, allocation-free Crystal structs and pure methods. Can be unit-tested without Godot running (`crystal spec`).
      - **Tier 2 (Declarative DSL)**: Node bindings, property exports, and signal adapters that wire Tier 1 into Godot scenes.

  - id: topic_02_hot_loop_invariants
    title: 2. Hot-Loop Invariants
    summary: Zero-allocation rules for game frames.
    content: |
      Avoid heap allocations inside `on_process` and `on_physics_process`.
      Use Crystal structs (`Vector3`, `Transform3D`) and reusable static buffers for raycasts and queries.
