id: TWO_TIER_ARCHITECTURE
title: The Two-Tier Architecture Standard
summary: Strict separation between raw algorithmic engines and user-facing declarative DSLs.
track: 03_dsl_codex
overview: |
  The foundational tenet of the Sol-Vin architecture is the **Two-Tier Engine & Declarative Builder**
  pattern. Every Crystal library, shard, or system authored in the organization must strictly decouple
  raw algorithmic computation, memory boundaries, and low-level FFI from the human-friendly,
  ergonomic Domain-Specific Language (DSL) layer.

related_sources:
