id: PROJECT_CELESTINE_GDD
title: "Project Celestine: Canonical 3D Retro Game Design Document (GDD)"
summary: Complete Game Design Document, mathematical balance formulas, Lapis scene architecture, and PS2 hardware budgets for Project Celestine.
track: 03_dsl_codex
overview: |
  **Project Celestine: Shards of the Astral Spire** is the flagship 3D retro sci-fi action-platformer
  and Prism ARPG designed for **Lapis** (Godot Engine 4.8+ in Crystal) and **Citrine** (PlayStation 2).
  Authored by **Epsilon (`Ε`)**, this canonical GDD formalizes the core gameplay loop, kinematic physics,
  elemental prism combat math, enemy archetypes, Lapis node hierarchies, and strict 60 FPS memory budgets
  adhering to the **Sol-Vin Two-Tier Engine & Declarative Builder Codex**.

