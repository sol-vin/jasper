id: COOKBOOK_OVERVIEW
title: "Two-Tier Crystal DSL & Hardening Cookbook: Multi-Shard Architecture"
summary: Unified architectural reference and hardening blueprints across Carbon, Crowbar, Bakelite, and Opal.
track: 05_hardening_cookbook
overview: |
  The **Two-Tier Crystal DSL & Hardening Cookbook** establishes the canonical engineering recipes for
  building, verifying, and hardening Sol-Vin Crystal shards. Approved under RFC Discussion #116
  (*Ecosystem-Wide Crowbar Corpus Regression Gate & Bakelite Deterministic Archive Signing*), this track
  documents how `sol-vin/carbon`, `sol-vin/crowbar`, `sol-vin/bakelite`, and `sol-vin/opal` decouple
  pure, deterministic Tier 1 engines from expressive Tier 2 declarative builders while enforcing
  cryptographic integrity, mutation regression gates, and the inviolable 60-second watchdog law.

related_sources:
